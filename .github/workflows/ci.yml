name: CI/CD

# Pipeline unique : qualité → build → déploiement.
# - Sur pull request : qualité + build (validation, sans déploiement).
# - Sur push vers main : qualité + build + déploiement GitHub Pages.
# Chaque étape est une barrière : rien n'est déployé si le lint, les types,
# les tests ou le build échouent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege par défaut ; le job de déploiement élève ses droits.
permissions:
  contents: read

# Annule les exécutions superflues sur les PR (feedback rapide) mais jamais
# sur main, pour ne pas interrompre un déploiement en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Qualité (lint · types · tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run typecheck
      # Les seuils de couverture vivent dans vitest.config.ts et font échouer
      # cette étape : la logique ne peut pas se découvrir en silence.
      - run: pnpm run test:coverage
      # Le résumé s'affiche sur la page du run, sans service tiers ni jeton.
      - name: Résumé de couverture
        if: always()
        run: node scripts/resume-couverture.mjs >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build statique
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm run generate
      # Un build qui compile ne prouve pas qu'il se déploie : le contact
      # sécurité était bien généré mais non servi, CI verte et site cassé.
      - name: Vérifier la sortie
        run: pnpm run verify:build
      # Le poids ne se dégrade jamais d'un coup : il glisse, une dépendance à
      # la fois. Ces plafonds échouent avant que ce soit le cas.
      - name: Budget de poids
        run: pnpm run verify:budget
      - name: Téléverser l'artefact Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .output/public

  deploy:
    name: Déploiement GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
